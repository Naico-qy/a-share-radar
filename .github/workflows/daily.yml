name: daily-data-update

# 每个交易日(周一~周五)北京时间 15:35 收盘后自动采集数据、生成报告并提交,
# 提交后 GitHub Pages 自动重新部署。(GitHub cron 只支持 UTC,07:35 UTC = 北京 15:35)
on:
  schedule:
    - cron: '35 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖(akshare,失败不影响运行——脚本会自动降级直连)
        run: |
          pip install -r scripts/requirements.txt || echo "WARN: akshare install failed, using direct fallback"

      - name: 运行每日数据流水线
        run: python scripts/run_pipeline.py

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化,跳过提交"
          else
            git commit -m "chore(data): 每日数据与报告更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
